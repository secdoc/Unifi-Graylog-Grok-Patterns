stages: [validate, secret-scan]

default:
  tags: ["${CI_RUNNER_TAG}"]

repository-integrity:
  stage: validate
  script:
    - |
      set -euo pipefail
      /usr/bin/python3 - <<'PY'
      import json
      import py_compile
      import subprocess
      from pathlib import Path

      excluded = {".git", ".venv", ".vscode", "node_modules", "site"}
      raw = subprocess.check_output(["git", "ls-files", "-z"])
      files = [Path(value.decode()) for value in raw.split(b"\0") if value]
      counts = {"json": 0, "python": 0, "shell": 0}
      for path in files:
          if any(part in excluded for part in path.parts) or not path.is_file():
              continue
          if path.suffix == ".json":
              json.loads(path.read_text(encoding="utf-8"))
              counts["json"] += 1
          elif path.suffix == ".py":
              py_compile.compile(str(path), doraise=True)
              counts["python"] += 1
          elif path.suffix == ".sh":
              subprocess.run(["bash", "-n", str(path)], check=True)
              counts["shell"] += 1
      print(json.dumps({"status": "ok", "validated": counts}, sort_keys=True))
      PY

secret-pattern-history:
  stage: secret-scan
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      set -euo pipefail
      /usr/bin/python3 - <<'PY'
      import re
      import subprocess

      patterns = {
          "private-key": re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----"),
          "github-token": re.compile(rb"\b(?:ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{50,})\b"),
          "aws-access-key": re.compile(rb"\b(?:AKIA|ASIA)[A-Z0-9]{16}\b"),
          "slack-token": re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{10,}\b"),
          "webhook-secret": re.compile(rb"https://(?:hooks\.slack\.com/services|discord(?:app)?\.com/api/webhooks)/[^\s'\"]+"),
      }
      objects = subprocess.check_output(["git", "rev-list", "--objects", "--all"])
      findings = []
      seen = set()
      for line in objects.splitlines():
          parts = line.split(b" ", 1)
          if len(parts) != 2:
              continue
          object_id, path = parts
          if object_id in seen:
              continue
          seen.add(object_id)
          if subprocess.check_output(["git", "cat-file", "-t", object_id]).strip() != b"blob":
              continue
          size = int(subprocess.check_output(["git", "cat-file", "-s", object_id]))
          if size > 2_000_000:
              continue
          data = subprocess.check_output(["git", "cat-file", "-p", object_id])
          if b"\x00" in data[:8192]:
              continue
          for rule, pattern in patterns.items():
              if pattern.search(data):
                  findings.append((path.decode("utf-8", "replace"), rule))
      if findings:
          print(f"secret scan failed: {len(findings)} high-confidence finding(s)")
          for path, rule in findings:
              print(f"  {path}: {rule}")
          raise SystemExit(1)
      print(f"secret scan passed: {len(seen)} unique Git objects inspected")
      PY
