stages: [validate, malware-scan]

default:
  tags: [phase4-untrusted]

repository-integrity:
  stage: validate
  script:
    - |
      set -euo pipefail
      /usr/bin/python3 - <<'PY'
      import json
      import py_compile
      import subprocess
      from pathlib import Path

      excluded = {".git", ".venv", "node_modules", "site"}
      raw = subprocess.check_output(["git", "ls-files", "-z"])
      files = [Path(value.decode()) for value in raw.split(b"\0") if value]
      counts = {"json": 0, "python": 0, "shell": 0}
      for path in files:
          if any(part in excluded for part in path.parts) or not path.is_file():
              continue
          if path.suffix == ".json":
              json.loads(path.read_text(encoding="utf-8"))
              counts["json"] += 1
          elif path.suffix == ".py":
              py_compile.compile(str(path), doraise=True)
              counts["python"] += 1
          elif path.suffix == ".sh":
              subprocess.run(["bash", "-n", str(path)], check=True)
              counts["shell"] += 1
      print(json.dumps({"status": "ok", "validated": counts}, sort_keys=True))
      PY

centralized-clamav:
  stage: malware-scan
  script:
    - export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - /usr/bin/mkdir -p reports
    - |
      report="$CI_PROJECT_DIR/reports/clamav.json"
      fallback="$(/usr/bin/mktemp "$CI_PROJECT_DIR/reports/.clamav-fallback.XXXXXX")"
      printf '%s\n' '{"state":"error","reason":"pipeline_not_completed"}' > "$fallback"
      /usr/bin/python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(value, dict)' "$fallback"
      /usr/bin/mv -f -- "$fallback" "$report"
    - stage="$CI_PROJECT_DIR/../clamav-stage-$CI_JOB_ID"
    - /usr/bin/install -d -m 0700 "$stage"
    - trap '/usr/bin/rm -rf "$stage"' EXIT
    - /usr/bin/git archive --format=tar "$CI_COMMIT_SHA" | /usr/bin/tar -C "$stage" -xf -
    - /usr/bin/tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -C "$stage" -cf clamav-scan.tar .
    - |
      set -o pipefail
      report="$CI_PROJECT_DIR/reports/clamav.json"
      scan_output="$(/usr/bin/mktemp "$CI_PROJECT_DIR/reports/.clamav-scan.XXXXXX")"
      set +e
      { printf '%s\n' "pipeline-${CI_PIPELINE_ID}-${CI_JOB_ID}"; printf '%s\n' "${CI_PROJECT_PATH_SLUG}-${CI_COMMIT_SHORT_SHA}.tar"; printf '%s\n' "gitlab://${CI_PROJECT_PATH}@${CI_COMMIT_SHA}"; /usr/bin/cat "$CI_PROJECT_DIR/clamav-scan.tar"; } |
        /usr/bin/sudo /usr/local/sbin/clamav-ci-scan > "$scan_output"
      scan_status=$?
      set -e
      if /usr/bin/python3 -c 'import json,sys; value=json.load(open(sys.argv[1], encoding="utf-8")); assert isinstance(value, dict)' "$scan_output"; then
        /usr/bin/mv -f -- "$scan_output" "$report"
      else
        /usr/bin/rm -f -- "$scan_output"
        exit 1
      fi
      exit "$scan_status"
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/clamav.json]
